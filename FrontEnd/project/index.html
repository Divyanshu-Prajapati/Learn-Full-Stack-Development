<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div id="main">
        <nav>

        </nav>
        <section class="allelem">
            <div class="todo elem" id="0">
                <img src="https://plus.unsplash.com/premium_photo-1683309568772-57011d6c1b7b?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8dG8lMjBkbyUyMGxpc3R8ZW58MHx8MHx8fDA%3D" alt="">
                <h3>To Do List</h3>
            </div>
            <div class="daily elem" id="1">
                <img src="https://images.unsplash.com/photo-1514782831304-632d84503f6f?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHBsYW5uZXJ8ZW58MHx8MHx8fDA%3D" alt="">
                <h3>Daily Planner</h3>
            </div>
            <div class="moti elem" id="2">
                <img src="https://images.unsplash.com/photo-1513353584023-2551b5339615?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTZ8fG1vdGl2YXRpb25hbHxlbnwwfHwwfHx8MA%3D%3D" alt="">
                <h3>Motivation</h3>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://images.unsplash.com/photo-1508962914676-134849a727f0?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHBvbW9kb3JvfGVufDB8fDB8fHww" alt="">
                <h3>Pomodoro Timer</h3>
            </div>
            <div class="goals elem" id="4">
                <img src="https://images.unsplash.com/photo-1610540604745-3e96fba9ccef?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8ZGFpbHklMjBnb2Fsc3xlbnwwfHwwfHx8MA%3D%3D" alt="">
                <h3>Daily Goals</h3>
            </div>


        </section>
        <section class="fullElem Todo-fullpage">
            <button class="back" id="0"> <i class="ri-close-large-line"></i></button>
            <h2>Your Personalized Task Lists</h2>
            <div class="todo-container">
                <div class="addtask">
                    <form>
                        <input id="task-input" type="text" placeholder="Enter your task">
                        <textarea name="" id="" placeholder="Enter Details"></textarea>
                        <div class="mark-imp">
                            <input type="checkbox" name="" id="check">
                            <label for="check">Mark as Important!</label>
                        </div>
                        <button>Add Task</button>
                    </form>
                </div>
                <div class="allTask">
                    
                </div>

            </div>
        </section>
        <section class="fullElem Daily-planner-fullpage">
            <button class="back" id="1"> <i class="ri-close-large-line"></i></button>
            <h1>Daily Planner</h1>
        </section>
        <section class="fullElem Motivation-fullpage">
            <button class="back" id="2"> <i class="ri-close-large-line"></i></button>
            <h1>Motivational Quotes</h1>
        </section>
        <section class="fullElem Pomodoro-fullpage">
            <button class="back" id="3"> <i class="ri-close-large-line"></i></button>
            <h1>Pomodoro Timer</h1>
        </section>
        <section class="fullElem Daily-goals-fullpage">
            <button class="back" id="4"> <i class="ri-close-large-line"></i></button>
            <h1>Daily Goals</h1>
        </section>

    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
